# Enable the OMP advisor in worktrees of this Firstmate repository.
# Project-local configuration does not enable the advisor in unrelated projects.
# No project-local model role is set, so OMP resolves the advisor role from higher-level configuration.
advisor:
  enabled: true

# Firstmate's todo list projects long-lived fleet work rather than one prompt's work.
# End-of-turn reminders would start a second model turn after an answer to the captain.
todo.reminders: false
